<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shred">
<meta name="theme-color" content="#e3141f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shred Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's whiteboard — loud, quick, no fluff
   IDEA: the gym whiteboard: circuits, rounds, tick marks
   PICTURE: the working session itself — week strip, circuits, timer
   COLOUR and TYPE: signal red on white / near-black; Archivo condensed heavy
   LAYOUT: one column, sticky week strip, sticky timer at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f0f0f);--ink:light-dark(#121212,#f3f3f3);--mut:light-dark(#6a6a6a,#9b9b9b);--line:light-dark(#e7e7e7,#262626);--card:light-dark(#f4f4f4,#1a1a1a);--red:#e3141f;--ok:light-dark(#121212,#f3f3f3)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{background:var(--red);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px) 0;position:sticky;top:0;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px}
.brand h1{margin:0;font-size:28px;font-weight:900;font-stretch:75%;font-style:italic;letter-spacing:-.01em}
.brand small{opacity:.85;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:0}
.dy{border:0;background:transparent;color:#fff;padding:8px 0 12px;border-bottom:4px solid transparent;display:grid;gap:2px;justify-items:center;min-height:56px}
.dy b{font-size:15px;font-weight:800;font-stretch:80%}
.dy i{font-style:normal;font-size:11px;opacity:.85;white-space:nowrap}
.dy.on{border-color:#fff}
.dy.rest{opacity:.6}
.dy.today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-left:3px;vertical-align:middle}
.wrap{max-width:720px;margin:0 auto;padding:20px max(4vw,16px)}
h2{font-size:clamp(30px,8vw,44px);line-height:1.02;margin:0 0 6px;font-weight:900;font-stretch:72%;text-transform:uppercase;text-wrap:balance}
.meta{color:var(--mut);font-size:14px;margin:0 0 14px}
.bar{height:10px;background:var(--card);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.bar span{display:block;height:100%;background:var(--red);transition:width .3s}
.pct{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.eq{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.eq span{font-size:13px;background:var(--card);padding:4px 10px;border-radius:20px}
.sw{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px}
.sw input{width:22px;height:22px;accent-color:var(--red)}
.circ{border-top:4px solid var(--ink);margin-top:26px;padding-top:10px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ch b{font-size:20px;font-weight:900;font-stretch:75%;text-transform:uppercase}
.tag{background:var(--ink);color:var(--bg);font-size:13px;padding:2px 9px;border-radius:5px;font-weight:700}
.note{font-size:13px;color:var(--mut);margin:4px 0}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ex.done .nm{text-decoration:line-through;color:var(--mut)}
.nm{font-weight:700;font-size:16px;line-height:1.3}
.tg{font-size:14px;color:var(--mut);white-space:nowrap}
.swap{grid-column:1/-1;font-size:13px;color:var(--red);margin:0}
.ctl{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-size:13px;font-weight:700;padding:0}
.dot.y{background:var(--red);border-color:var(--red);color:#fff}
.play{height:36px;padding:0 12px;border-radius:18px;border:2px solid var(--ink);background:transparent;font-size:13px;font-weight:700;white-space:nowrap}
.kg{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.kg input{width:84px;height:36px;font-size:16px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.rest-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;color:var(--mut);font-size:14px}
.big{display:block;width:100%;margin-top:28px;height:54px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:17px;font-weight:800;text-transform:uppercase;font-stretch:85%}
.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);height:48px;margin-top:10px}
.pick{display:grid;gap:8px;margin:16px 0}
.pick button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px;min-height:56px}
.pick button.on{border-color:var(--red)}
.pick b{display:block;font-size:16px}.pick span{font-size:13px;color:var(--mut)}
textarea{width:100%;min-height:140px;font:16px/1.5 Archivo,sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.restday{padding:40px 0;text-align:left}
.restday p{font-size:17px;max-width:46ch}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px max(4vw,16px) calc(12px + env(safe-area-inset-bottom));display:none;z-index:9}
.timer.show{display:flex;align-items:center;gap:12px}
.timer .t{font-size:40px;font-weight:900;font-stretch:75%;font-variant-numeric:tabular-nums;min-width:3.2ch}
.timer .l{flex:1;font-size:14px;line-height:1.3}
.timer button{height:44px;min-width:44px;border-radius:22px;border:2px solid var(--bg);background:transparent;color:var(--bg);font-weight:700;padding:0 12px}
.timer.end{background:var(--red);color:#fff}.timer.end button{border-color:#fff;color:#fff}
.ok{color:var(--red);font-weight:700}
.nextc{background:var(--card);border-left:5px solid var(--red);border-radius:10px;padding:12px 14px;margin:0 0 18px;display:grid;gap:6px;justify-items:start}
.nextc .d{font-size:14px;color:var(--mut)}.nextc .nx{font-size:17px}
.play.on{background:var(--red);border-color:var(--red);color:#fff}
.brand>span{display:flex;align-items:center;gap:10px}
.hbtn{border:2px solid #fff;background:transparent;color:#fff;border-radius:18px;height:36px;padding:0 14px;font-size:13px;font-weight:800}
.hbtn.on{background:#fff;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 20px}
.stats div{background:var(--card);border-radius:12px;padding:12px}
.stats b{display:block;font-size:26px;font-weight:900;font-stretch:75%;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mut)}
.chart{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:150px;border-bottom:2px solid var(--line);margin-top:8px}
.chart div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.chart i{display:block;background:var(--red);border-radius:5px 5px 0 0;min-height:2px}
.chart small{font-size:11px;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.clab{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font-size:11px;color:var(--mut);text-align:center;margin-top:4px}
.hcard{border-bottom:1px solid var(--line);padding:16px 0}
.hcard .d{font-size:14px;color:var(--mut)}
.hcard h3{margin:2px 0 8px;font-size:20px;font-weight:800;font-stretch:85%;line-height:1.2}
.hrow{display:flex;gap:24px;flex-wrap:wrap}
.hrow span{display:grid;font-size:13px;color:var(--mut)}
.hrow b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hnote{font-size:14px;margin:8px 0 0;white-space:pre-wrap}
.sec{font-size:22px;font-weight:900;font-stretch:75%;text-transform:uppercase;margin:28px 0 4px}
.mins{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;color:var(--mut)}
.mins input{width:90px;height:44px;font-size:16px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>

 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.day){cur=+b.dataset.day;picking=false;view='day';render();scrollTo(0,0);return}
 if(b.dataset.tick){const id=b.dataset.tick,r=+b.dataset.r,n=Q.ticks[id]||0;Q.ticks[id]=n===r+1?r:r+1;if(!Q.start[cur])Q.start[cur]=Date.now();save();const y=scrollY;render();scrollTo(0,y);return}
 if(b.dataset.time){start(+b.dataset.time,b.dataset.lab);return}
 if(b.dataset.del){if(b.dataset.sure){const id=+b.dataset.del;S.hist=S.hist.filter(x=>x.id!==id);Object.keys(Q.doneId).forEach(d=>{if(Q.doneId[d]===id){delete Q.doneId[d];delete Q.done[d]}});save();render()}else{b.dataset.sure=1;b.textContent='Tap again to remove'}return}
 if(b.dataset.pw!==undefined){S.pw[S.prog]=+b.dataset.pw;S.p[S.prog]=blank();useProg(S.prog);picking=false;save();render();return}
 if(b.dataset.prog){useProg(b.dataset.prog);view='day';cur=todayIdx;picking=false;save();render();scrollTo(0,0);return}
 if(b.dataset.go){Q.pick[cur]=b.dataset.go;picking=false;save();render();scrollTo(0,0);return}
 if(b.dataset.fri){Q.pick[cur]=b.dataset.fri;picking=false;save();render();return}
 const a=b.dataset.act;
 if(a==='refri'){Object.keys(Q.ticks).forEach(t=>{if(t.startsWith(cur+'-'))delete Q.ticks[t]});delete Q.pick[cur];if(Q.done[cur])finish(cur);delete Q.start[cur];picking=true;save();render()}
 if(a==='addw'){picking=true;render()}
 if(a==='keeprest'){picking=false;render()}
 if(a==='finish'){finish(cur);save();render()}
 if(a==='start'){Q.start[cur]=Date.now();save();render()}
 if(a==='home'){view='home';render();scrollTo(0,0)}
 if(a==='hist'){view=view==='hist'?'day':'hist';render();scrollTo(0,0)}
 if(a==='copy'){try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>{b.textContent='Copied ✓'},()=>{b.textContent='Copy failed – try again'})}catch(e){b.textContent='Copy not allowed here'}}
 if(a==='restore'){try{const o=JSON.parse(document.getElementById('rb').value);if(!o||!Array.isArray(o.hist))throw 0;load(o);useProg(S.prog);save();render()}catch(e){b.textContent='That backup could not be read'}}
 if(a==='reset'){if(b.dataset.sure){Q.ticks={};Q.done={};Q.pick={};Q.notes={};Q.start={};Q.doneId={};Q.mins={};save();render()}else{b.dataset.sure=1;b.textContent='Tap again to clear all ticks'}}
});
document.body.addEventListener('input',e=>{const t=e.target;if(t.dataset.kg!==undefined){S.kg[t.dataset.kg]=t.value;save()}if(t.id==='fm'){Q.mins[cur]=t.value;save()}if(t.id==='fn'){Q.notes[cur]=t.value;save()}});
document.body.addEventListener('change',e=>{if(e.target.id==='swp'){S.swaps=e.target.checked;save();const y=scrollY;render();scrollTo(0,y)}});
render();
setInterval(()=>{const e=document.getElementById('elt');if(e&&Q.start[cur])e.textContent=fmtDur((Date.now()-Q.start[cur])/1000)},15000);
try{if('serviceWorker' in navigator&&!/claude/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
